<!doctype html>
<!-- Documento HTML base donde React monta la aplicación -->
<html lang="es"> <!-- idioma español -->
  <head> <!-- cabecera del documento -->
    <meta charset="UTF-8" /> <!-- codificación de caracteres UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- escala para móviles -->
    <meta name="description" content="Sistema web de inventario y punto de venta multisucursal para una ferretería." /> <!-- descripción para buscadores -->
    <meta name="theme-color" content="#1f2124" /> <!-- color de la barra del navegador en móvil -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" /> <!-- icono de la pestaña -->
    <title>Ferretería POS multisucursal</title> <!-- título de la pestaña -->
  </head> <!-- fin cabecera -->
  <body> <!-- cuerpo del documento -->
    <div id="root"></div> <!-- contenedor donde React renderiza la app -->
    <script type="module" src="/src/main.jsx"></script> <!-- carga el punto de entrada de React -->
  </body> <!-- fin cuerpo -->
</html> <!-- fin documento -->
